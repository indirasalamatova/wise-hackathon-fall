services:
  postgres:
    image: postgres:15-alpine
    container_name: unbound_postgres
    environment:
      POSTGRES_USER: unbound_user
      POSTGRES_PASSWORD: unbound_password
      POSTGRES_DB: unbound_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unbound_user -d unbound_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: rustfs/rustfs:latest
    container_name: unbound_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: '/data'
      RUSTFS_ADDRESS: '0.0.0.0:9000'
      RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
      RUSTFS_ACCESS_KEY: 'minioadmin'
      RUSTFS_SECRET_KEY: 'minioadmin'
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: unbound_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "1"
    container_name: unbound_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://unbound_user:unbound_password@postgres:5432/unbound_db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://storage:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: unbound-docs
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      # Set both in a root .env file (see .env.example). GOOGLE_CLIENT_ID must match the frontend's.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # AI agents (chat + document analysis). Without a key the rest of the app still works.
      # LLM_PROVIDER: gemini or anthropic; unset = gemini when GEMINI_API_KEY is set.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      AGENT_EFFORT: ${AGENT_EFFORT:-high}
      # Guidelines verified longer ago than this are treated as out of date.
      GUIDELINE_MAX_AGE_DAYS: ${GUIDELINE_MAX_AGE_DAYS:-90}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: unbound_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's own node_modules (Linux binaries) instead of the host's.
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
services:
  postgres:
    image: postgres:15-alpine
    container_name: unbound_postgres
    environment:
      POSTGRES_USER: unbound_user
      POSTGRES_PASSWORD: unbound_password
      POSTGRES_DB: unbound_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  storage:
    image: rustfs/rustfs:latest
    container_name: unbound_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: '/data'
      RUSTFS_ADDRESS: '0.0.0.0:9000'
      RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
      RUSTFS_ACCESS_KEY: 'minioadmin'
      RUSTFS_SECRET_KEY: 'minioadmin'
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: unbound_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  minio_data:
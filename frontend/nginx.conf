server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed build assets never change; cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/app/...) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
